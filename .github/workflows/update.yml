# Refreshes the FPL data twice a day and commits it; Cloudflare Pages redeploys on every commit.
# Runs with nothing new make no commit (update.py only rewrites files when the numbers change).
name: Update FPL data

on:
  schedule:
    - cron: "0 7,22 * * *"   # 07:00 and 22:00 UTC: after the evening games and after bonus is confirmed
  workflow_dispatch:          # "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python update.py
      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public
          git diff --staged --quiet || (git commit -m "Update FPL data" && git push)
